# Puente entre el catalogo y la API oficial.
#
# El catalogo salio del Google Sheet, con los nombres en español. La API
# responde en ingles. Sin este mapeo, sincronizar no encuentra nada que
# actualizar aunque todo lo demas funcione.
#
# Se aplica con:
#
#   bin/rails clash:mapear
#
# ATENCION: un nombre mal escrito **no da error**. Simplemente deja ese elemento
# sin sincronizar para siempre, y nadie se entera. Por eso lo que esta abajo hay
# que verificarlo contra la API antes de confiar en el:
#
#   bin/rails 'clash:nombres[#TAG_DE_UN_JUGADOR]'
#
# Esa tarea imprime los nombres exactos que devuelve la API y marca con ✓ los
# que ya estan mapeados. Lo que quede sin ✓ es lo que falta o esta mal escrito.
#
# Los que aparecen en blanco son elementos nuevos del juego cuyo nombre en
# ingles no se pudo confirmar. Se dejan vacios a proposito: es preferible que
# figuren como "sin mapear" en el informe a que queden mal.
#
# Defensas y trampas no estan porque la API no las expone: son carga manual.

