# Despliegue en Render: base de datos, API y frontend.
#
# Se aplica desde el dashboard con Blueprints → New Blueprint Instance, apuntando
# a este repo. Render lee este archivo y crea los tres servicios.
#
# Verificado antes de escribirlo, levantando la imagen de produccion contra una
# base real: la imagen construye, `db:prepare` corre solo al arrancar, Thruster
# respeta HTTP_PORT y la API responde con force_ssl activo.
#
# Los nombres llevan el prefijo `clash-progreso` porque los obvios estaban
# tomados: `clash-front.onrender.com` es la app de otra persona. En Render el
# espacio de nombres es global, asi que un nombre generico casi seguro ya existe
# y el servicio termina con un sufijo que no se puede predecir.

databases:
  - name: clash-progreso-db
    databaseName: clash_dashboard_production
    user: clash
    plan: free

services:
  # ---------------------------------------------------------------- API Rails
  - type: web
    name: clash-progreso-api
    runtime: docker
    plan: free
    region: oregon
    # El Dockerfile de produccion que genera Rails: multi-stage, usuario sin
    # privilegios y Thruster al frente. El Dockerfile.dev de al lado no sirve
    # aca, es el que incluye rspec y debug.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /up
    # No se define dockerCommand a proposito. El entrypoint corre `db:prepare`
    # solo cuando los dos ultimos argumentos son `./bin/rails server`, que es el
    # CMD por defecto. Sobreescribirlo dejaria la base sin migrar.
    envVars:
      # Thruster escucha en el 80 por defecto; Render espera el 10000.
      - key: HTTP_PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: clash-progreso-db
          property: connectionString
      # No hay master.key en el repo: se saco y se roto. Sin secret_key_base
      # Rails no arranca en produccion, asi que va por variable de entorno.
      - key: SECRET_KEY_BASE
        generateValue: true
      # Sin esto Devise firmaria los tokens con secret_key_base. Separarlo
      # permite rotar uno sin invalidar lo otro.
      - key: JWT_SECRET
        generateValue: true
      # El origen que rack-cors deja pasar. Se completa a mano despues del
      # primer deploy con la URL que Render le haya dado al frontend. Si queda
      # mal, el navegador bloquea las peticiones: molesto, pero no peligroso.
      - key: FRONTEND_URL
        sync: false
      # Atado a una IP: hay que declarar la de salida de Render en
      # https://developer.clashofclans.com/. Sin el, la busqueda de clan y
      # jugador responde 503 y el resto de la app funciona igual.
      - key: COC_TOKEN
        sync: false

  # ----------------------------------------------------------- Frontend build
  # Sin `plan` ni `region`: un sitio estatico no tiene tipo de instancia, lo
  # sirve un CDN. Declararlos hace fallar la validacion del blueprint.
  - type: web
    name: clash-progreso-web
    runtime: static
    rootDir: frontend
    # VITE_API_URL entra al build desde la variable de abajo, que Render
    # completa con la URL real de la API.
    buildCommand: npm ci && VITE_API_URL="https://$API_HOST/api/v1" npm run build
    staticPublishPath: ./dist
    envVars:
      # La clave de todo esto: la URL de la API la resuelve Render mirando el
      # servicio, no se escribe a mano.
      #
      # Antes habia un rewrite de /api hacia una URL fija. El problema no era
      # que fuera fea: si ese nombre lo registra un tercero, el frontend le
      # manda las peticiones —con el header Authorization incluido— a un
      # servicio ajeno, y desde afuera todo parece funcionar.
      - key: API_HOST
        fromService:
          type: web
          name: clash-progreso-api
          property: host
    routes:
      # El router del cliente maneja las rutas: cualquier ruta que no sea un
      # archivo del build cae en index.html.
      - type: rewrite
        source: /*
        destination: /index.html
